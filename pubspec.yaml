name: credence_banking_app
description: "A secure, intuitive digital banking experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_advanced_drawer: ^1.5.0
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  get: ^4.7.3
  http: ^1.6.0
  intl: ^0.20.2
  ionicons: ^0.2.2
  package_info_plus: ^9.0.0
  pinput: ^6.0.1
  rxdart: any
  toastification: ^3.0.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/font/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  remove_alpha_ios: true
  image_path: "assets/images/credence_logo.jpg"
  adaptive_icon_foreground: "assets/images/credence_logo.jpg"

flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#ffffff"
  image: "assets/images/credence_icon.png"

  android_12:
    color: "#193bbd"
    image: "assets/images/credence_icon.png"
